# pebbles-build.conf — the only per-app build identity.
# Copy to the repo root and fill in. Engines live in the Pebbles checkout.

# PB_KIND="flutter"              # set (or leave unset to auto-detect pubspec.yaml)
# PB_FLUTTER_DIR="."             # or client_app
# PB_FLUTTER_FLAVOR=""           # passed to flutter build --flavor

PB_XCODEPROJ="HelpingHands.xcodeproj"
PB_XCODEGEN=1                    # 1 = run xcodegen generate when project.yml exists
PB_DEVELOPMENT_TEAM="563V2QK49N"           # Apple team id for automatic signing

# iOS
PB_IOS_SCHEME="HelpingHands"
PB_IOS_BUNDLE_ID="com.helpinghands.app"
PB_IOS_APP_NAME="HelpingHands"
PB_IOS_GIT_RESET=0               # 1 = git reset --hard origin/main before compile
PB_IOS_DEPLOYMENT_TARGET="17.0"
# PB_IOS_DEVICE_ID=""            # optional fallback if pb_detect_device fails
# iPad uses the same iOS identity (`pebbles build ipad` / ./build_ipad.sh).
# PEBBLES_IPAD_DEVICE_ID / PEBBLES_IPAD_SIM override device / simulator.

# Watch (optional)
# PB_WATCH_SCHEME=""
# PB_WATCH_BUNDLE_ID=""

# macOS (optional)
# PB_MACOS_SCHEME=""
# PB_MACOS_APP_NAME=""
# PB_MACOS_TEAM_ID=""
# PB_MACOS_NOTARY_PROFILE=""
# PB_MACOS_BUNDLE_ID=""
# PB_MACOS_SYSEXT_BUNDLE_ID=""
# PB_MACOS_PROFILE_APP=""
# PB_MACOS_PROFILE_SYSEXT=""
# PB_MACOS_SYSEXT=0

# visionOS (optional)
# PB_VISION_SCHEME=""
# PB_VISION_BUNDLE_ID=""
# PB_VISION_SIM_NAME="Vision"

# TestFlight (optional)
# PB_TESTFLIGHT_SCHEME=""         # defaults to PB_IOS_SCHEME
# PB_TESTFLIGHT_AFTER=''          # eval'd after a successful upload

# Android (optional)
# PB_ANDROID_DIR="android"
# PB_ANDROID_PACKAGE=""
# PB_ANDROID_APK="android/app/build/outputs/apk/debug/app-debug.apk"
# PB_ANDROID_BLOB_DIR=""
# PB_ANDROID_FLAVOR="debug"
# PB_ANDROID_GRADLE_TASK=":app:assembleDebug"
# PB_ANDROID_PUBLIC_URL=""
