<div class=l><h1>穿手指舵机拉线</h1><ol start=10>
<li>用 2×14 毫米的销子，把舵机底座和 MCP（掌指关节）装到手指近节上。</li>
<li>把 6 号舵机的线穿过手指底座。</li>
<li>从远端的两个轴承之间穿过。</li>
<li>穿过中节顶部的孔，再穿进远节（指尖）。</li>
<li>在做好的记号处打一个 Ashley 止动结。</li>
<li>3、4、5 号舵机重复以上步骤。</li></ol>
<div class=k>记号长度（从线轮出口量起）：<br>3、4、5 号 = 140 毫米 · 6 号 = 150 毫米<br>拉线（Pull Cable）· 联动线（Coupling Cable，已装好，不要动）</div></div>
