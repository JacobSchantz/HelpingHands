<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aero Hand Page</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; color: #ccc;
    font-family: -apple-system, Helvetica, Arial, sans-serif; }
  img { display: block; width: 100vw; height: 100vh; object-fit: contain; }
  #bar { position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-between; align-items: center;
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); font-size: 15px;
    background: linear-gradient(transparent, rgba(0,0,0,.7)); }
  #bar a { color: #fff; text-decoration: none; padding: 6px 12px; border-radius: 10px; background: rgba(255,255,255,.14); }
  #miss { position: fixed; inset: 0; display: none; place-items: center; text-align: center; padding: 24px; font-size: 18px; }
</style>
</head>
<body>
<img id="pg" alt="">
<div id="miss"><div>Page image not rendered yet.<br>Run <code>python3 render_pages.py</code> in the guide folder,<br>or <a href="aero_guide_original.pdf" style="color:#3ee06a">open the PDF</a>.</div></div>
<div id="bar"><a href="index.html">All pages</a><span id="n"></span><a href="aero_guide_original.pdf">PDF</a></div>
<script>
  const last = 50, img = document.getElementById('pg'), miss = document.getElementById('miss');
  let p = Math.min(last, Math.max(1, parseInt(new URLSearchParams(location.search).get('p')) || 1));
  function show() {
    miss.style.display = 'none'; img.style.display = 'block';
    img.src = 'p' + p + '.png';
    document.getElementById('n').textContent = p + ' / ' + last;
    document.title = 'Aero Hand page ' + p;
    history.replaceState(null, '', '?p=' + p);
  }
  function go(d) { const q = Math.min(last, Math.max(1, p + d)); if (q !== p) { p = q; show(); } }
  img.onerror = () => { img.style.display = 'none'; miss.style.display = 'grid'; };
  addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === ' ') go(1);
    else if (e.key === 'ArrowLeft') go(-1);
  });
  // Tap the outer thirds to turn pages; swipe works too.
  let x0 = null;
  addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, { passive: true });
  addEventListener('touchend', e => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0; x0 = null;
    if (Math.abs(dx) > 50) go(dx < 0 ? 1 : -1);
  });
  img.addEventListener('click', e => {
    const f = e.clientX / innerWidth;
    if (f < 1 / 3) go(-1); else if (f > 2 / 3) go(1);
  });
  show();
</script>
</body>
</html>
