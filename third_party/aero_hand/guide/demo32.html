<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thread Finger Cable</title>
<style>
html,body{margin:0;height:100%;background:#0d1117;color:#f5f5f5;font-family:-apple-system,Helvetica,Arial,sans-serif;overflow:hidden}
svg{width:100vw;height:100vh;display:block}
.cap{font-size:50px;font-weight:700;fill:#fff}
.sub{font-size:36px;fill:#ffd166}
.lbl{font-size:28px;fill:#cfd8e3;font-weight:600}
.cnt{font-size:34px;fill:#8ab4f8;font-weight:700}
.note{font-size:24px;fill:#9aa4b2}
.seg{fill:#9aa3ad;stroke:#4b525a;stroke-width:4}
.brg{fill:#d6dbe0;stroke:#333;stroke-width:4}
</style></head><body>
<svg id="s" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid meet">
<rect width="1920" height="1080" fill="#0d1117"/>
<text id="cnt" class="cnt" x="60" y="70">Step 1 of 7</text>
<text class="lbl" x="1860" y="70" text-anchor="end">Aero Hand · Guide p.32 · Thread finger servo cable</text>
<text id="cap" class="cap" x="60" y="160"></text>
<text id="sub" class="sub" x="60" y="220"></text>
<!-- servo + spool -->
<g id="servo">
 <rect x="110" y="470" width="190" height="170" rx="14" fill="#c62828" stroke="#5a0f0f" stroke-width="4"/>
 <text x="205" y="565" text-anchor="middle" font-size="28" fill="#fff" font-weight="700">SERVO 6</text>
 <circle cx="300" cy="555" r="62" fill="#e8e8e8" stroke="#555" stroke-width="5"/>
 <circle cx="300" cy="555" r="40" fill="none" stroke="#f3e9c9" stroke-width="10"/>
 <circle cx="300" cy="555" r="8" fill="#555"/>
 <circle cx="318" cy="530" r="7" fill="#f3e9c9" stroke="#8a7a4a" stroke-width="2"/>
</g>
<text class="lbl" x="205" y="690" text-anchor="middle">Servo + cable spool</text>
<text class="lbl" x="205" y="725" text-anchor="middle" style="font-size:22px">(pre-tied knot inside spool)</text>
<!-- finger -->
<g id="seg0">
 <rect class="seg" x="420" y="485" width="160" height="95" rx="18"/>
 <text class="lbl" x="500" y="640" text-anchor="middle">Servo base</text>
</g>
<g id="seg1">
 <rect class="seg" x="575" y="490" width="70" height="85" rx="30" style="fill:#b6bdc5"/>
 <rect class="seg" x="640" y="492" width="420" height="78" rx="26"/>
 <circle class="brg" cx="610" cy="532" r="22"/>
 <text class="lbl seglbl" x="610" y="455" text-anchor="middle">MCP</text>
 <text class="lbl seglbl" x="850" y="640" text-anchor="middle">Proximal</text>
 <g id="seg2">
  <rect class="seg" x="1085" y="495" width="300" height="72" rx="24"/>
  <circle class="brg" cx="1080" cy="532" r="22"/>
  <circle cx="1150" cy="513" r="9" fill="#222" stroke="#000" stroke-width="2"/>
  <text class="lbl seglbl" x="1235" y="640" text-anchor="middle">Medial</text>
  <g id="seg3">
   <path class="seg" d="M1405 498 L1640 508 Q1720 522 1650 560 L1405 566 Z"/>
   <circle class="brg" cx="1400" cy="532" r="22"/>
   <text class="lbl seglbl" x="1540" y="640" text-anchor="middle">Distal (tip)</text>
  </g>
 </g>
</g>
<circle id="pin" cx="610" cy="532" r="9" fill="#ffd166" stroke="#7a5a00" stroke-width="3" opacity="0"/>
<text id="pinlbl" class="sub" x="610" y="410" text-anchor="middle" opacity="0">2x14mm pin</text>
<path id="coup" fill="none" stroke="#29a3ff" stroke-width="7" stroke-linecap="round"/>
<text class="lbl" x="1330" y="720" fill="#29a3ff" style="fill:#5bb8ff">Coupling cable (already installed, leave it)</text>
<path id="cord" fill="none" stroke="#fff6dc" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
<circle id="tip" r="13" fill="#ffd166" opacity="0"/>
<g id="knot" opacity="0"><circle r="20" fill="#fff6dc" stroke="#c9a227" stroke-width="5"/><circle r="8" fill="#c9a227"/></g>
<text id="knotlbl" class="sub" x="0" y="0" text-anchor="middle" opacity="0">Ashley stopper knot at mark</text>
<g id="meas" opacity="0">
 <line x1="318" y1="830" x2="1560" y2="830" stroke="#ffd166" stroke-width="4"/>
 <line x1="318" y1="805" x2="318" y2="855" stroke="#ffd166" stroke-width="4"/>
 <line x1="1560" y1="805" x2="1560" y2="855" stroke="#ffd166" stroke-width="4"/>
 <text class="sub" x="940" y="885" text-anchor="middle">Marked length from spool exit: 150 mm (servo 6, pinky)</text>
</g>
<g id="arrow" opacity="0"><path d="M240 760 L160 760" stroke="#ff5252" stroke-width="10" marker-end="url(#ah)"/><text class="sub" x="250" y="772" style="fill:#ff8a80">servo pulls</text></g>
<defs><marker id="ah" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6Z" fill="#ff5252"/></marker></defs>
<g id="tbl" opacity="0">
 <rect x="560" y="760" width="800" height="210" rx="16" fill="#1b2330" stroke="#8ab4f8" stroke-width="3"/>
 <text class="sub" x="600" y="815">Servo 3 · Index  → mark at 140 mm</text>
 <text class="sub" x="600" y="860">Servo 4 · Middle → mark at 140 mm</text>
 <text class="sub" x="600" y="905">Servo 5 · Ring   → mark at 140 mm</text>
 <text class="sub" x="600" y="950" style="fill:#9aa4b2">Servo 6 · Pinky  → 150 mm (done)</text>
</g>
<text class="note" x="960" y="1050" text-anchor="middle">Illustration based on guide page 32. Check the photos for exact holes. · Space / → next · ← back</text>
</svg>
<script>
"use strict";
const $ = id => document.getElementById(id);
const P = {1:[610,532],2:[1080,532],3:[1400,532]};
// waypoints: [segment, x, y]
const W = [[0,318,530],[0,390,505],[0,430,512],[0,575,512],[1,610,508],[1,700,512],[1,1060,510],[1,1080,508],
 [2,1150,513],[2,1385,512],[2,1400,508],[3,1440,512],[3,1560,516]];
const MARK = [3,1560,516];
const STOPS = [0,4,8,12]; // waypoint index reached at end of steps 11,12,13
const STEPS = [
 {cap:"10. Install servo base + MCP onto finger proximal", sub:"Push a 2x14mm pin through the MCP joint", dur:5500},
 {cap:"11. Thread the servo 6 pull cable through the finger base", sub:"White cord leaves the cable spool on the servo", dur:6000},
 {cap:"12. Thread it between the bearings", sub:"Cord rides over the bearing pulleys along the finger", dur:6000},
 {cap:"13. Through the top medial hole and into the distal", sub:"Top hole of the medial segment, then into the fingertip", dur:6000},
 {cap:"14. Tie an Ashley stopper knot at the mark", sub:"Mark = 150 mm from spool exit for servo 6 (pinky)", dur:6500},
 {cap:"Check: pull the cord and the finger curls", sub:"The knot stops in the distal, so the servo bends all joints", dur:6500},
 {cap:"15. Repeat for servos 3, 4 and 5", sub:"Index, middle, ring use a 140 mm mark", dur:7000}
];
let step = 0, t0 = performance.now();
let ang = [0,0,0,0];
function rot(p, c, a){const s=Math.sin(a),k=Math.cos(a),dx=p[0]-c[0],dy=p[1]-c[1];return [c[0]+dx*k-dy*s,c[1]+dx*s+dy*k];}
function world(seg,x,y){let p=[x,y];for(let i=seg;i>=1;i--)p=rot(p,P[i],ang[i]);return p;}
function setTf(){
 const deg = a => a*180/Math.PI;
 $("seg1").setAttribute("transform",`rotate(${deg(ang[1])} ${P[1][0]} ${P[1][1]})`);
 $("seg2").setAttribute("transform",`rotate(${deg(ang[2])} ${P[2][0]} ${P[2][1]})`);
 $("seg3").setAttribute("transform",`rotate(${deg(ang[3])} ${P[3][0]} ${P[3][1]})`);
 document.querySelectorAll(".seglbl").forEach(e=>e.style.opacity = ang[1]<-0.05?0:1);
}
function partial(pts, f){ // f in [0, pts.length-1]
 const n=Math.floor(f), r=f-n, out=pts.slice(0,Math.min(n+1,pts.length));
 if(n<pts.length-1 && r>0){const a=pts[n],b=pts[n+1];out.push([a[0]+(b[0]-a[0])*r,a[1]+(b[1]-a[1])*r]);}
 return out;
}
const ease = x => x<0?0:x>1?1:x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
function frame(now){
 const S=STEPS[step]; let u=(now-t0)/S.dur;
 if(u>=1){go(step+1);requestAnimationFrame(frame);return;}
 const e=ease(Math.min(1,u/0.75));
 $("cnt").textContent=`Step ${step+1} of ${STEPS.length}`;
 $("cap").textContent=S.cap; $("sub").textContent=S.sub;
 // curl
 let c=0; if(step===5){c=u<0.15?0:u<0.55?ease((u-0.15)/0.4):u<0.8?1:1-ease((u-0.8)/0.2);}
 ang=[0,-0.55*c,-0.75*c,-0.6*c]; setTf();
 // cord progress
 let f;
 if(step===0) f=0; else if(step<=3) f=STOPS[step-1]+(STOPS[step]-STOPS[step-1])*e; else f=W.length-1;
 const pts=W.map(w=>world(w[0],w[1],w[2]));
 // spool reel-in visual: when pulled, start point shifts onto spool
 const pp=partial(pts,f);
 if(step===5 && c>0){pp[0]=[318-0,530+0]; }
 $("cord").setAttribute("d", pp.length>1?"M"+pp.map(p=>p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" L"):"");
 const tip=pp[pp.length-1];
 $("tip").setAttribute("cx",tip[0]);$("tip").setAttribute("cy",tip[1]);
 $("tip").setAttribute("opacity",(step>=1&&step<=3)?1:0);
 // pin
 const pin=$("pin"); pin.setAttribute("opacity",step===0?1:0.9);
 pin.setAttribute("r", step===0? (9+20*(1-e)) : 9);
 $("pinlbl").setAttribute("opacity",step===0?1:0);
 // coupling cable medial->distal
 const a=world(2,1300,552), b=world(3,1470,552);
 $("coup").setAttribute("d",`M${a[0]} ${a[1]} L${b[0]} ${b[1]}`);
 // knot
 const k=world(MARK[0],MARK[1],MARK[2]);
 const kon=step>=4; $("knot").setAttribute("opacity",kon?1:0);
 $("knot").setAttribute("transform",`translate(${k[0]} ${k[1]}) scale(${step===4?0.5+0.5*e:1})`);
 const kl=$("knotlbl"); kl.setAttribute("x",k[0]); kl.setAttribute("y",k[1]-50); kl.setAttribute("opacity",step===4?1:0);
 $("meas").setAttribute("opacity",step===4?1:0);
 $("arrow").setAttribute("opacity",step===5?1:0);
 $("tbl").setAttribute("opacity",step===6?1:0);
 requestAnimationFrame(frame);
}
function go(n){step=(n+STEPS.length)%STEPS.length;t0=performance.now();}
addEventListener("keydown",ev=>{
 if(ev.code==="Space"||ev.key==="ArrowRight"){ev.preventDefault();go(step+1);}
 else if(ev.key==="ArrowLeft"){ev.preventDefault();go(step-1);}
});
addEventListener("click",()=>go(step+1));
requestAnimationFrame(frame);
</script>
</body></html>
