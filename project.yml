name: HelpingHands
options:
  bundleIdPrefix: com.helpinghands
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  xcodeVersion: "16.0"

packages:
  PebblesKit:
    url: https://github.com/JacobSchantz/Pebbles
    branch: main

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "563V2QK49N"

targets:
  # One app for iPhone, iPad and Mac: one target, one bundle ID, every file
  # shared. Per-platform differences are SDK-conditional settings below.
  HelpingHands:
    type: application
    platform: auto
    supportedDestinations: [iOS, macOS]
    sources:
      # `excludes` keeps the plist and entitlements out of Copy Bundle Resources
      # (a copied Info.plist ships unexpanded $(PRODUCT_BUNDLE_IDENTIFIER)).
      - path: HelpingHands
        excludes:
          - "Info.plist"
          - "HelpingHands.entitlements"
      - Generated
    dependencies:
      - package: PebblesKit
    preBuildScripts:
      - name: Write Git Info
        script: "bash ${SRCROOT}/Scripts/write_git_info.sh"
    postBuildScripts:
      - name: Stage CAD Models
        # Copies cad/'s meshes + a manifest into the bundle. Runs last so the
        # resources folder exists, but still before codesign.
        script: "python3 ${SRCROOT}/Scripts/stage_cad_models.py"
      - name: Stage Plans
        # Copies plans/'s markdown + a manifest into the bundle so a new plan
        # is listenable on the next build without touching Swift.
        script: "python3 ${SRCROOT}/Scripts/stage_plans.py"
      - name: Stage Aero Guide
        # Copies third_party/aero_hand/guide (gallery, animations, PDF) into
        # the bundle as AeroGuide/ for the Workshop's build-guide screen.
        script: "python3 ${SRCROOT}/Scripts/stage_aero_guide.py"
    settings:
      base:
        PRODUCT_NAME: HelpingHands
        PRODUCT_BUNDLE_IDENTIFIER: com.helpinghands.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "0"
        # Jake's individual team (only the ATG app uses the ATG team).
        DEVELOPMENT_TEAM: "563V2QK49N"
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.9"
        INFOPLIST_FILE: HelpingHands/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        ENABLE_DEBUG_DYLIB: NO
        ENABLE_PREVIEWS: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Mac only. Not sandboxed: the app runs ~/HelpingHands-tools' venv and
        # opens /dev/cu.usbmodem*; these cover camera, mic and Music.
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": HelpingHands/HelpingHands.entitlements
        # The asset catalog only carries an iOS app icon, so the Mac build ships
        # without one rather than failing actool.
        "ASSETCATALOG_COMPILER_APPICON_NAME[sdk=macosx*]": ""
        "COMBINE_HIDPI_IMAGES[sdk=macosx*]": YES
    info:
      path: HelpingHands/Info.plist
      properties:
        CFBundleDisplayName: Helping Hands
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: "Records voice notes for test feedback, and listens for spoken commands while a plan is read aloud."
        NSSpeechRecognitionUsageDescription: "Recognises short spoken commands — next, back, repeat, pause — so a plan can be followed hands-free, and the names you say for Aero Hand recordings."
        # The aero_hand scripts run as the Mac app's children (AeroHandRunner),
        # so these prompts name Helping Hands instead of Terminal.
        NSCameraUsageDescription: "Watches your hand so the Aero Hand can copy it (teleop)."
        NSAppleEventsUsageDescription: "Starts a song in Music before the Aero Hand performs."
        CFBundleURLTypes:
          - CFBundleURLName: com.helpinghands.app.aero
            CFBundleURLSchemes:
              - helpinghands
        NSHighResolutionCapable: true
        UIUserInterfaceStyle: Dark
        UILaunchScreen:
          UIColorName: AccentColor
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
