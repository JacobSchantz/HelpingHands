name: HelpingHands
options:
  bundleIdPrefix: com.helpinghands
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  xcodeVersion: "16.0"

packages:
  PebblesKit:
    url: https://github.com/JacobSchantz/Pebbles
    branch: main

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "563V2QK49N"

targets:
  HelpingHands:
    type: application
    platform: iOS
    sources:
      - HelpingHands
      - Generated
    dependencies:
      - package: PebblesKit
    preBuildScripts:
      - name: Write Git Info
        script: "bash ${SRCROOT}/Scripts/write_git_info.sh"
    postBuildScripts:
      - name: Stage CAD Models
        # Copies cad/'s meshes + a manifest into the bundle. Runs last so the
        # resources folder exists, but still before codesign.
        script: "python3 ${SRCROOT}/Scripts/stage_cad_models.py"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.helpinghands.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "0"
        DEVELOPMENT_TEAM: "563V2QK49N"
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.9"
        INFOPLIST_FILE: HelpingHands/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_DEBUG_DYLIB: NO
        ENABLE_PREVIEWS: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: HelpingHands/Info.plist
      properties:
        CFBundleDisplayName: Helping Hands
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: "Records voice notes for test feedback."
        UIUserInterfaceStyle: Dark
        UILaunchScreen:
          UIColorName: AccentColor
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  HelpingHandsMac:
    type: application
    platform: macOS
    sources:
      - HelpingHands
      - Generated
    dependencies:
      - package: PebblesKit
    preBuildScripts:
      - name: Write Git Info
        script: "bash ${SRCROOT}/Scripts/write_git_info.sh"
    postBuildScripts:
      - name: Stage CAD Models
        script: "python3 ${SRCROOT}/Scripts/stage_cad_models.py"
    settings:
      base:
        PRODUCT_NAME: HelpingHands
        PRODUCT_BUNDLE_IDENTIFIER: com.helpinghands.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "0"
        DEVELOPMENT_TEAM: "563V2QK49N"
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.9"
        INFOPLIST_FILE: HelpingHands/Info-macOS.plist
        ENABLE_PREVIEWS: NO
        # The asset catalog only carries an iOS app icon, so the Mac build ships
        # without one rather than failing actool.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
    info:
      path: HelpingHands/Info-macOS.plist
      properties:
        CFBundleDisplayName: Helping Hands
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: "Records voice notes for test feedback."
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NSHighResolutionCapable: true
