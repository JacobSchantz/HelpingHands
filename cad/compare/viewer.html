<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design compare</title>
<!--
  One viewer for both renders of a design, so they can only differ in the
  geometry. ?design=<id from designs.json>
    &mode=web | stl | diff | sheet   (sheet: every view x web/STL/diff on one image)
    &view=front | side | top | iso | exploded
    &live    orbit controls + window.hh for the Mac app; a concept that moves gets sliders
    &set=pull:60,mode:robot   preset those sliders (screenshots)
-->
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js", "three/addons/": "./vendor/" } }
</script>
<style>
  html, body { margin: 0; height: 100%; background: #0d1a22; color: #dfe7ef; overflow: hidden;
               font: 13px -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; }
  canvas { display: block; }
  .tag { position: absolute; padding: 4px 8px; border-radius: 6px; background: rgba(0,0,0,.45);
         font-weight: 600; pointer-events: none; white-space: nowrap; }
  #message { position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
             text-align: center; padding: 24px; color: #9fb0c0; line-height: 1.5; }
  #result { display: none; }
  .web { color: #ff7cc0; } .stl { color: #6fe3ea; }
  #pose { position: absolute; left: 10px; bottom: 30px; max-width: calc(100% - 20px); padding: 10px 12px; border-radius: 10px;
          background: rgba(6, 14, 20, .78); display: grid; gap: 6px; font-size: 12px; }
  #pose label { display: grid; grid-template-columns: 92px minmax(80px, 220px) 44px auto; align-items: center; gap: 8px; }
  #pose label:has(select), #pose label:has([type=checkbox]) { grid-template-columns: 92px auto; }
  #pose b { font-weight: 600; font-variant-numeric: tabular-nums; }
  #pose button { background: #24323d; color: inherit; border: 0; border-radius: 6px; padding: 2px 8px; }
  #pose pre { margin: 4px 0 0; font: 11px ui-monospace, Menlo, monospace; color: #b8c6d3; white-space: pre-wrap; }
  @media (max-width: 600px) {
    #pose { box-sizing: border-box; left: 8px; right: 8px; bottom: 8px;
            max-height: 40%; overflow-y: auto; padding: 8px; }
    #pose label { grid-template-columns: 76px minmax(60px, 1fr) 36px auto; min-height: 32px; gap: 4px; }
    #pose label:has(select), #pose label:has([type=checkbox]) { grid-template-columns: 76px minmax(0, 1fr); }
    #pose select { min-width: 0; width: 100%; }
    #pose input[type=range] { min-width: 0; width: 100%; }
    #pose button { min-width: 36px; min-height: 32px; }
    #pose pre { display: none; }
  }
</style>
</head>
<body>
<div id="message"></div>
<pre id="result"></pre>
<script type="module" src="./viewer.js"></script>
</body>
</html>
