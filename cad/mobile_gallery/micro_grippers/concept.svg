<text x="875" y="465" font-size="29">Original finger contact surfaces</text><text x="875" y="520" font-size="29">Motor centered above finger plane</text><text x="875" y="575" font-size="29">Bought spline plate + real case ears</text><text x="875" y="630" font-size="29">Low support around both pivots</text>
<text x="875" y="725" font-size="35" fill="#ffc981">What must be proved</text>
<text x="875" y="790" font-size="28">Cable clearance and spring load</text><text x="875" y="845" font-size="28">Reversal loss, stiffness, tip force</text><text x="875" y="900" font-size="28">Full stroke and servo travel</text><text x="875" y="955" font-size="28">No new part version issued yet</text>
<text x="80" y="1090" font-size="33">Tiny tips do not establish positioning accuracy.</text><text x="80" y="1145" font-size="27" fill="#b0c8d8">Reference study for robot assembly and fine manipulation • no clinical or micron-accuracy claim</text>
