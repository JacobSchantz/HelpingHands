<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
<title id="title">Fine-motion exploration beside the current print candidate</title><desc id="desc">Base 25 and Gripper 29 remain unchanged. An unbuilt cable and spring concept would retain the original jaw tips and lower synchronizing gears, with the servo centered overhead on its actual mounting hardware.</desc>
