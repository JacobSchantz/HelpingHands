<rect x="70" y="150" width="1460" height="140" rx="22" fill="#204c43"/>
<text x="110" y="210" font-size="38">Current print candidate: Base 25 + Gripper 29</text><text x="110" y="260" font-size="30">Unchanged. Printing approval ≠ measured fit or strength.</text>
<rect x="70" y="330" width="720" height="690" rx="22" fill="#1d3344"/>
<text x="110" y="390" font-size="35">Proposed cable + return spring</text><text x="110" y="434" font-size="25" fill="#ffc981">Original schematic • not CAD • not to scale</text>
