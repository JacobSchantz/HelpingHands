<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HelpingHands designs</title>
<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js","three/addons/":"./vendor/"}}</script>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101b24;color:#e4edf3;font:14px system-ui}body{display:flex;flex-direction:column}header{height:52px;flex:none;display:flex;align-items:center;gap:6px;padding:4px 8px;background:#101b24}select,button{font:inherit;color:inherit;background:#243746;border:1px solid #456174;border-radius:7px;min-height:40px}select{flex:1;min-width:0;padding:0 9px;text-overflow:ellipsis}button{padding:0 12px;cursor:pointer}#explode{position:absolute;right:16px;bottom:16px;z-index:5;min-height:44px;padding:0 18px;background:#28465a;box-shadow:0 3px 14px #0005}#pose{position:absolute;left:12px;right:150px;bottom:16px;z-index:5;max-width:420px;min-height:44px;display:flex;align-items:center;gap:10px;padding:0 14px;border-radius:7px;background:#28465ae6;box-shadow:0 3px 14px #0005;font-size:13px}#pose[hidden]{display:none}#pose input{flex:1;min-width:60px;accent-color:#83d2ff}#pose b{min-width:70px;font-weight:600;font-variant-numeric:tabular-nums;text-align:right}#refresh{width:40px;padding:0;font-size:23px}button[hidden]{display:none}#stage{position:relative;flex:1;min-height:0;overflow:hidden;background:#13232f}canvas{position:absolute;inset:0;display:block;width:100%;height:100%;pointer-events:none}#viewports{position:absolute;inset:0;display:grid;grid-template-columns:repeat(var(--columns,3),minmax(0,1fr));grid-auto-rows:minmax(0,1fr)}.viewport{position:relative;min-width:0;min-height:0;overflow:hidden;touch-action:none;border:1px solid #294150;outline-offset:-3px;cursor:grab}.viewport[hidden]{display:none}.viewport:focus-visible{outline:2px solid #83d2ff}.viewport:active{cursor:grabbing}.label{position:absolute;left:10px;top:8px;z-index:2;font-size:15px;font-weight:650;pointer-events:none;text-shadow:0 1px 3px #000}.loading{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:8px 10px;max-width:95%;border-radius:6px;background:#13232fdf;text-align:center;font-size:12px;pointer-events:none}.loading[hidden],img[hidden]{display:none}.preview{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none}.viewport.has-model .preview{display:none}#message{position:absolute;z-index:4;top:8px;left:8px;right:8px;padding:9px;background:#563d26ed;border-radius:6px;white-space:pre-wrap;font-size:13px}#message[hidden]{display:none}#viewports.focused{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
#presets{position:absolute;right:16px;bottom:70px;z-index:5;display:flex;gap:4px;padding:4px;border-radius:9px;background:#28465ae6;box-shadow:0 3px 14px #0005}#presets button{min-height:36px;padding:0 11px;background:#243746}.mixer{position:absolute;right:6px;top:4px;z-index:3;display:flex;gap:4px;max-width:calc(100% - 12px)}.mixer select{flex:0 1 auto;min-width:0;min-height:32px;font-size:12px;background:#243746e6}.viewport:has(.mixer) .label{top:44px}.photo{position:absolute;right:6px;top:4px;z-index:3;flex:none;max-width:calc(100% - 170px);min-height:32px;font-size:12px;background:#243746e6}
#visibility{margin:auto;width:min(360px,calc(100% - 32px));max-height:80vh;padding:0;color:inherit;background:#1a2b38;border:1px solid #456174;border-radius:12px}#visibility::backdrop{background:#0009}#visibility h2{margin:0;padding:14px 16px 6px;font-size:15px}#visibility p{margin:0;padding:0 16px 8px;font-size:12px;color:#9fb3c1}#visibility label{display:flex;align-items:center;gap:12px;min-height:46px;padding:0 16px;border-top:1px solid #294150;cursor:pointer}#visibility input{width:20px;height:20px;accent-color:#83d2ff}#visibility form{display:flex;justify-content:flex-end;padding:10px 12px;border-top:1px solid #294150}
#tune{position:absolute;top:0;right:0;bottom:0;z-index:6;width:min(360px,100%);display:flex;flex-direction:column;background:#1a2b38f2;border-left:1px solid #456174;box-shadow:-4px 0 18px #0006}#tune[hidden]{display:none}.tune-head{display:flex;align-items:center;gap:6px;padding:8px 10px 4px}.tune-head b{flex:1;font-size:15px}.tune-head button{min-height:34px;padding:0 10px;font-size:13px}#tune-status{padding:2px 12px 8px;font-size:12px;color:#9fb3c1;min-height:22px}#tune-status.error{color:#ffb38a}#tune-status.busy{color:#83d2ff}#tune-list{flex:1;overflow-y:auto;padding:0 12px 24px;overscroll-behavior:contain}#tune-list h3{margin:14px 0 4px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:#9fb3c1}.knob{display:grid;grid-template-columns:1fr auto;gap:0 8px;padding:5px 0;border-top:1px solid #29415080}.knob span{font-size:13px;min-width:0}.knob output{font-size:12px;font-variant-numeric:tabular-nums;color:#cfe3ef;cursor:pointer;text-align:right}.knob.changed span,.knob.changed output{color:#ffd27a}.knob input{grid-column:1/3;width:100%;margin:4px 0 0;accent-color:#83d2ff;height:24px}
body:has(#tune:not([hidden])) :is(#presets,#explode){right:376px}body:has(#tune:not([hidden])) #pose{right:520px}
@media(max-width:600px){body:has(#tune:not([hidden])) :is(#presets,#explode,#pose){display:none}body:has(#tune:not([hidden])) #viewports{bottom:52%}#tune{top:auto;left:0;width:100%;height:52%;border-left:0;border-top:1px solid #456174}#viewports:not(.focused){grid-template-columns:minmax(0,1fr);grid-template-rows:repeat(var(--rows,3),minmax(0,1fr))}.label{font-size:15px;top:7px;left:10px}}
</style>
</head>
<body>
<header><select id="project" aria-label="Project"></select><button id="shown" aria-haspopup="dialog" title="Show or hide generations">Hide…</button><button id="back" hidden aria-label="All generations" title="All generations">All</button><button id="tune-open" hidden aria-controls="tune" aria-expanded="false" title="Slide this design's parameters">Tune</button><button id="refresh" aria-label="Check for updates" title="Check for updates">↻</button></header>
<main id="stage" aria-label="Interactive design comparison"><div id="viewports"></div><div id="message" role="status" hidden></div><aside id="tune" hidden aria-label="Tune parameters"><div class="tune-head"><b id="tune-title">Tune</b><button id="tune-reset" title="Every slider back to this version's value">Reset</button><button id="tune-copy" title="Copy the changed values as JSON, for the next version's params.json">Copy</button><button id="tune-close" aria-label="Close" title="Close">×</button></div><div id="tune-status" role="status">Drag a slider: the real CAD re-renders.</div><div id="tune-list"></div></aside><div id="presets" role="group" aria-label="Line every model up"><button data-view="top" title="Every model from the photo's angle">Top</button><button data-view="front" title="Every model tip-on">Front</button><button data-view="side" title="Every model from the side">Side</button><button data-view="iso" title="Every model at an angle">Iso</button></div><button id="explode" aria-pressed="false" title="Separate model parts">Explode</button><label id="pose" hidden><span>Closed</span><input id="openness" type="range" min="0" max="100" value="100" aria-label="Open or close the gripper"><b id="openness-value">100% open</b></label></main>
<dialog id="visibility" aria-labelledby="visibility-title"><h2 id="visibility-title">Show generations</h2><p>Unchecked ones are hidden on every device until you check them again.</p><div id="visibility-list"></div><form method="dialog"><button>Done</button></form></dialog>
<script type="module" src="./gallery.js"></script>
</body>
</html>
