<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HelpingHands designs</title>
<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js","three/addons/":"./vendor/"}}</script>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101b24;color:#e4edf3;font:14px system-ui}body{display:flex}
select,button{font:inherit;color:inherit;background:#243746;border:1px solid #456174;border-radius:7px;min-height:40px}select{min-width:0;padding:0 9px;text-overflow:ellipsis}button{padding:0 12px;cursor:pointer}button[hidden]{display:none}
#stage{position:relative;flex:1;min-width:0;min-height:0;overflow:hidden;background:#13232f}canvas{position:absolute;inset:0;display:block;width:100%;height:100%;pointer-events:none}
#viewports{position:absolute;inset:0;display:grid;grid-template-columns:repeat(var(--columns,3),minmax(0,1fr));grid-auto-rows:minmax(0,1fr)}#viewports.focused{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
.viewport{position:relative;min-width:0;min-height:0;overflow:hidden;touch-action:none;border:1px solid #294150;outline-offset:-3px;cursor:grab}.viewport[hidden]{display:none}.viewport:focus-visible{outline:2px solid #83d2ff}.viewport:active{cursor:grabbing}
.label{position:absolute;left:10px;top:8px;z-index:2;font-size:15px;font-weight:650;pointer-events:none;text-shadow:0 1px 3px #000}.loading{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:8px 10px;max-width:95%;border-radius:6px;background:#13232fdf;text-align:center;font-size:12px;pointer-events:none}.loading[hidden],img[hidden]{display:none}.preview{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none}.viewport.has-model .preview{display:none}
#message{position:absolute;z-index:4;top:8px;left:8px;right:8px;padding:9px;background:#563d26ed;border-radius:6px;white-space:pre-wrap;font-size:13px}#message[hidden]{display:none}
#explode{position:absolute;right:16px;bottom:16px;z-index:5;min-height:44px;padding:0 18px;background:#28465a;box-shadow:0 3px 14px #0005}#pose{position:absolute;left:12px;bottom:16px;z-index:5;min-height:44px;min-width:96px;padding:0 18px;background:#28465a;box-shadow:0 3px 14px #0005}
aside{flex:none;width:min(360px,100%);display:flex;flex-direction:column;background:#1a2b38;border-left:1px solid #456174}aside[hidden]{display:none}
.head{display:flex;align-items:center;gap:6px;padding:8px 10px 4px}.head select{flex:1}.head b{flex:1;font-size:15px}.head button{min-height:34px;padding:0 10px;font-size:13px}
#panel-list,#tune-list{flex:1;overflow-y:auto;padding:0 6px 24px;overscroll-behavior:contain}
.part-row{display:flex;align-items:center;gap:6px;min-height:50px;padding:6px 4px 2px;border-top:1px solid #294150}.part-row select{flex:1}.part-row .tune{flex:none;min-height:36px;padding:0 9px;font-size:12px}
.note{padding:0 6px 6px 50px;font-size:12px;white-space:pre-wrap;color:#ffb38a}.note.follow{color:#9fe0a8}
.piece-row{display:flex;align-items:center;gap:8px;min-height:40px;padding:0 6px 0 24px}.piece-row .name{flex:1;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.piece-row.off .name,.piece-row.off .swatch{opacity:.4}.swatch{flex:none;width:12px;height:12px;border-radius:3px;border:1px solid #9fb3c199}
.eye{flex:none;width:40px;min-height:36px;padding:0;display:grid;place-items:center}.eye svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}.eye:disabled{opacity:.3}.only{flex:none;min-height:34px;padding:0 9px;font-size:12px}.only[aria-pressed=true]{background:#83d2ff;color:#101b24;border-color:#83d2ff}
.version-row{display:flex;align-items:center;width:100%;min-height:44px;padding:0 10px;border:0;border-top:1px solid #29415080;border-radius:0;background:none;text-align:left}.version-row[aria-current=true]{background:#28465a}
#tune-status{padding:2px 12px 8px;font-size:12px;color:#9fb3c1;min-height:22px}#tune-status.error{color:#ffb38a}#tune-status.busy{color:#83d2ff}#tune-list h3{margin:14px 0 4px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:#9fb3c1}.knob{display:grid;grid-template-columns:1fr auto;gap:0 8px;padding:5px 0;border-top:1px solid #29415080}.knob span{font-size:13px;min-width:0}.knob output{font-size:12px;font-variant-numeric:tabular-nums;color:#cfe3ef;cursor:pointer;text-align:right}.knob.changed span,.knob.changed output{color:#ffd27a}.knob input{grid-column:1/3;width:100%;margin:4px 0 0;accent-color:#83d2ff;height:24px}
@media(max-width:600px){body{flex-direction:column}aside{width:100%;height:52%;border-left:0;border-top:1px solid #456174}#viewports:not(.focused){grid-template-columns:minmax(0,1fr);grid-template-rows:repeat(var(--rows,3),minmax(0,1fr))}}
</style>
</head>
<body>
<main id="stage" aria-label="3D view"><div id="viewports"></div><div id="message" role="status" hidden></div><button id="explode" aria-pressed="false" title="Separate model parts">Explode</button><button id="pose" hidden aria-pressed="false" title="Open or close the gripper">Close</button></main>
<aside id="panel" aria-label="Parts"><div class="head"><select id="project" aria-label="Design family"></select><button id="tune-open" hidden aria-controls="tune" aria-expanded="false" title="Slide this design's parameters">Tune</button></div><div id="panel-list"></div></aside>
<aside id="tune" hidden aria-label="Tune parameters"><div class="head"><b id="tune-title">Tune</b><button id="tune-reset" title="Every slider back to this version's value">Reset</button><button id="tune-copy" title="Copy the changed values as JSON, for the next version's params.json">Copy</button><button id="tune-close" aria-label="Close" title="Close">×</button></div><div id="tune-status" role="status">Drag a slider: the real CAD re-renders.</div><div id="tune-list"></div></aside>
<script type="module" src="./gallery.js"></script>
</body>
</html>
